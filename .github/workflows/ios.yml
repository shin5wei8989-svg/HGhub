name: iOS build

# 手动触发：Actions 页面 → iOS build → Run workflow
# 产出无签名 ipa（Payload 手工打包），下载后用全能签等工具重签安装
on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS (unsigned ipa)
    # Xcode 26 工具链不再提供 swiftCompatibility56，而 swift-rs 的 Swift 胶水层
    # 固定按 iOS 13 编译并引用该库；Xcode 16（macos-15 runner）自带兼容库
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境诊断
        run: |
          xcodebuild -version
          /bin/ls /Applications | /usr/bin/grep -i xcode || true
          find /Applications -name 'libswiftCompatibility56.a' 2>/dev/null | /usr/bin/head -3 || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-xcode16-v1

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Xcode 工程
        env:
          # 占位 Team ID：init 强制要求非空；实际构建时已关闭签名，不会用到
          APPLE_DEVELOPMENT_TEAM: "1A2B3C4D5E"
        run: |
          # Xcode 26 链接 iOS 15.0 目标时缺 swiftCompatibility56 库；15.4 起系统自带 Swift 5.6 运行时
          /usr/bin/python3 - <<'EOF'
          import json
          p = 'src-tauri/tauri.ios.conf.json'
          c = json.load(open(p))
          c.setdefault('bundle', {}).setdefault('iOS', {})['minimumSystemVersion'] = '15.4'
          json.dump(c, open(p, 'w'), indent=2)
          print('minimumSystemVersion ->', c['bundle']['iOS']['minimumSystemVersion'])
          EOF
          pnpm tauri ios init --ci

      - name: 关闭代码签名（改工程配置）
        run: |
          set -euo pipefail
          PROJ="$(ls -d src-tauri/gen/apple/*.xcodeproj | head -n 1)"
          PBX="$PROJ/project.pbxproj"
          echo "patching $PBX"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' "$PBX"
          sed -i '' -E 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBX"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.4;/g' "$PBX"
          /usr/bin/python3 - "$PBX" <<'EOF'
          import re, sys
          p = sys.argv[1]
          with open(p, encoding="utf-8") as f:
              content = f.read()
          if "CODE_SIGNING_ALLOWED" not in content:
              content = re.sub(
                  r"(buildSettings = \{)",
                  r"\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;",
                  content,
              )
              with open(p, "w", encoding="utf-8") as f:
                  f.write(content)
              print("injected CODE_SIGNING_ALLOWED = NO")
          else:
              print("CODE_SIGNING_ALLOWED already present")
          EOF

      - name: 构建（tauri 包装命令；导出 ipa 因无签名失败属预期，只要 .app 产出即可）
        env:
          APPLE_DEVELOPMENT_TEAM: "1A2B3C4D5E"
        run: |
          set -uo pipefail
          set +e
          export PATH="$HOME/.cargo/bin:$PATH"
          export IPHONEOS_DEPLOYMENT_TARGET=15.4
          pnpm tauri ios build --export-method debugging
          code=$?
          echo "tauri ios build exit code: $code"
          APP_PATH="$(find src-tauri/gen/apple/build -name 'HGhub.app' -type d -path '*iphoneos*' | head -n 1)"
          echo "app: ${APP_PATH:-<none>}"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未产出 .app（构建真正失败）"
            exit 1
          fi

      - name: 打包无签名 ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/gen/apple/build -name 'HGhub.app' -type d -path '*iphoneos*' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "app: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          IPA="HGhub_${VERSION}_unsigned.ipa"
          rm -f "$IPA"
          zip -qry "$IPA" Payload
          /usr/bin/plutil -p "Payload/$(basename "$APP_PATH")/Info.plist" | /usr/bin/grep -E "CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion" || true
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-ipa
          path: HGhub_*_unsigned.ipa
          if-no-files-found: error
