name: iOS unsigned IPA

# 手动触发，或在 push tag v* 时自动构建
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (unsigned ipa, for 万能签 resign)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: pnpm install --frozen-lockfile

      - name: Tauri iOS init（幂等，已存在则跳过）
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm tauri ios init
          else
            echo "gen/apple 已存在，跳过 init"
          fi

      # 未签名构建：跳过 codesign，产物 ipa 供万能签等工具重签
      - name: 构建（unsigned ipa）
        env:
          TAURI_IOS_AUTO_SIGNING: "false"
        run: pnpm tauri ios build --target aarch64-apple-ios --ci

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find src-tauri/target -name '*.ipa' -exec cp {} artifacts/ \;
          # 若 tauri 未产出 ipa（仅 .app），手动打一个未签名 ipa
          if [ -z "$(ls artifacts/*.ipa 2>/dev/null)" ]; then
            APP=$(find src-tauri/target -type d -name '*.app' -path '*iphoneos*' | head -1)
            if [ -n "$APP" ]; then
              mkdir -p Payload
              cp -R "$APP" Payload/
              V="${{ steps.ver.outputs.version }}"
              zip -qr "artifacts/HGhub_${V}_ios_unsigned.ipa" Payload
              rm -rf Payload
            fi
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: artifacts/*
          if-no-files-found: error
